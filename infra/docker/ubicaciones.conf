# Ubicaciones compartidas por nginx.conf (HTTP, desarrollo/local) y nginx.tls.conf.template (producción).
root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

# API: proxy al contenedor de Elysia.
location /api/ {
    include /etc/nginx/snippets/seguridad.conf;
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# Recursos con hash: cache larga.
location /assets/ {
    include /etc/nginx/snippets/seguridad.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# SPA: cualquier otra ruta sirve index.html.
location / {
    include /etc/nginx/snippets/seguridad.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
