# Cabeceras de seguridad (RNF-03). nginx no hereda add_header cuando un location define el suyo,
# por eso este archivo se incluye en cada location.
# CSP: sin 'unsafe-inline' en script-src (el bundle se carga por <script src>); tiles.openfreemap.org es el
# único host externo (mapa, sprites, glyphs). HSTS solo se envía por HTTPS (ver hsts-map.conf).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security $hsts always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tiles.openfreemap.org; font-src 'self' data: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
