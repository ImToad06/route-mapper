pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files} && git add {staged_files}
commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
pre-push:
  commands:
    typecheck:
      run: bun run typecheck
