# Producción. Uso: docker compose up -d --build
name: lh-rutas

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-lh_rutas}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lh} -d ${POSTGRES_DB:-lh_rutas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-lh}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lh_rutas}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      OSRM_URL: http://osrm:5000
      VROOM_URL: http://vroom:3000
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-lh-rutas/0.1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/salud').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-lh}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-lh_rutas}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./infra/backup/backup.sh:/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Motor de rutas (Fase 3). Requiere ejecutar antes infra/osrm/prepare.sh para poblar el volumen.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    profiles: ["mapas"]
    command: osrm-routed --algorithm mld --max-trip-size 200 --max-table-size 500 /data/colombia-latest.osrm
    volumes:
      - ./infra/osrm/data:/data:ro

  # Optimizador VRP (Fase 3).
  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    restart: unless-stopped
    profiles: ["mapas"]
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./infra/vroom/config.yml:/conf/config.yml:ro
    depends_on:
      - osrm

volumes:
  db_data:
  backup_data:
