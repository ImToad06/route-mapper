# Blueprint de Render para la DEMOSTRACIÓN: base de datos + API + panel web.
# Render → New → Blueprint → elija este repositorio y la rama dev (o main). Guía completa: docs/demo-render.md
# Incluye OSRM (solo el área de Barranquilla) y VROOM como servicios privados: Calcular/Optimizar funcionan en vivo.
databases:
  - name: lh-db
    databaseName: lh_rutas
    user: lh
    plan: basic-256mb # "free" funciona pero Render la borra a los 30 días
    region: virginia
    postgresMajorVersion: "17"
    # Solo accesible desde los servicios de Render. Para cargar los datos de la demo desde su computador,
    # agregue SU IP (/32) en el panel de la base (Access Control) y quítela al terminar. Ver docs/demo-render.md.
    ipAllowList: []

services:
  - type: web
    name: lh-rutas-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter # "free" duerme tras 15 min sin uso: el primer clic de la demo tardaría ~1 min
    region: virginia
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Bogota
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: lh-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Motor de rutas: servicios privados de Render, alcanzables solo por su nombre dentro de la red interna.
      - key: OSRM_URL
        value: http://lh-osrm:5000
      - key: VROOM_URL
        value: http://lh-vroom:3000
      - key: COOKIE_SEGURA
        value: "true"
      - key: CONFIAR_PROXY
        value: "true"
      # Debe ser exactamente la URL pública del panel (la de lh-rutas-web). Ajústela si Render le asignó otra.
      - key: CORS_ORIGIN
        value: https://lh-rutas-web.onrender.com

  - type: pserv
    name: lh-osrm
    runtime: docker
    dockerfilePath: ./infra/render/osrm/Dockerfile
    dockerContext: ./infra/render/osrm
    plan: starter
    region: virginia

  - type: pserv
    name: lh-vroom
    runtime: docker
    dockerfilePath: ./infra/render/vroom/Dockerfile
    dockerContext: .
    plan: starter
    region: virginia

  - type: web
    name: lh-rutas-web
    runtime: static
    buildCommand: npm install -g bun && bun install --frozen-lockfile --ignore-scripts && cd apps/web && bun run build
    staticPublishPath: apps/web/dist
    routes:
      # El navegador habla siempre con este mismo dominio (la cookie de sesión lo exige); Render reenvía /api a la API.
      # Si la URL de lh-rutas-api es otra, cámbiela aquí.
      - type: rewrite
        source: /api/*
        destination: https://lh-rutas-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
